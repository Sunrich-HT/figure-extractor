[project]
name = "figure-extractor"
version = "0.1.0"
description = "Extract complete figures/images from PDF, arXiv, and HTML papers — an AI-agent skill (Claude Code, Codex, Kimi)."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
  "figure-extraction", "extract-figures", "pdf", "arxiv", "html",
  "pymupdf", "agent-skill", "claude-skill", "claude-code", "codex", "kimi",
]
dependencies = [
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
  "beautifulsoup4>=4.12.0",
]

[project.scripts]
figure-extractor = "figure_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
