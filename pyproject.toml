[project]
name = "figure-extractor"
version = "0.3.0"
description = "Extract complete figures and tables from PDF, arXiv, OpenReview, ACL and HTML papers — an AI-agent skill (Claude Code, Codex, Kimi)."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "figure-extraction", "extract-figures", "pdf", "arxiv", "html",
  "pymupdf", "agent-skill", "claude-skill", "claude-code", "codex", "kimi",
]
dependencies = [
  "PyMuPDF>=1.24.0",
]

[project.optional-dependencies]
# HTML article sources only; the PDF path deliberately needs nothing here.
html = ["beautifulsoup4>=4.12.0"]
dev = ["pytest>=7.0", "beautifulsoup4>=4.12.0"]

[project.scripts]
figure-extractor = "figure_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
